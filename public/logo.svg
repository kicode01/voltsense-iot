<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Maroon to Crimson Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" /> <!-- Tailwind rose-700 -->
      <stop offset="100%" stop-color="#4c0519" /> <!-- Tailwind rose-950 -->
    </linearGradient>

    <!-- Subtle Glass Edge Reflection -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- iOS-Style Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />

  <!-- Background Radar Waves.
       NOTE: these used to carry filter="url(#shadow)" (an feDropShadow with
       stdDeviation=16). At the 40px size the header renders this mark at, that
       shadow worked out to roughly 3.75 device px of blur and made the bolt look
       like a soft white blob. The shadow is gone on purpose — keep it out. -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round">
    <!-- Outer wave -->
    <path d="M 144 368 A 158 158 0 0 1 368 144" stroke-opacity="0.15" />
    <!-- Inner wave -->
    <path d="M 192 320 A 90 90 0 0 1 320 192" stroke-opacity="0.3" />
  </g>

  <!-- Foreground Lightning Bolt (Smooth Corners) -->
  <path d="M 286 121 L 166 271 L 246 271 L 226 391 L 346 241 L 266 241 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
</svg>

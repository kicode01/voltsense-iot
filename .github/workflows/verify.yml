name: verify

# The same gate the project runs locally, on every push and pull request.
#
# PREREQUISITE: the eight VITE_FIREBASE_* values must exist as repository secrets
# (Settings -> Secrets and variables -> Actions). They are the PUBLIC web config —
# the same strings that ship in the browser bundle — but they live in `.env`, which
# is gitignored, so CI has to be given them explicitly. Without them the build still
# SUCCEEDS and merely produces a bundle with the values missing, which surfaces much
# later as a puzzling harness assertion ("VAPID key present in bundle — MISSING").
# The "Verify build configuration" step below exists to fail at the real cause.
#
# Order matters: lint and typecheck are fast and fail early; the integration
# harness launches Chromium and is the slowest step, so it runs last.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------
      # Static gates
      # ---------------------------------------------------------------------

      - name: Lint
        run: npm run lint

      # No type annotation files are required: tsconfig.json uses checkJs, so
      # tsc validates the existing .js/.jsx sources directly.
      - name: Type check
        run: npm run typecheck

      # ---------------------------------------------------------------------
      # Unit tests
      #
      # These cover pure logic and config drift (.env / VAPID assertions) only.
      # Anything that needs a real HTTP server or a browser lives in the
      # integration harness below.
      # ---------------------------------------------------------------------

      - name: Unit tests
        run: npm run test

      # ---------------------------------------------------------------------
      # Build
      #
      # The integration harness asserts against dist/, so this must run before
      # it. CI starts from a clean checkout, so there is no stale-dist hazard
      # here (locally, `rm -rf dist` is required first — see the rules doc).
      # ---------------------------------------------------------------------

      # Fail at the cause, not the symptom. A missing secret produces a green build
      # and a red harness ~90 seconds later, which reads like a code bug.
      - name: Verify build configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          missing=""
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_DATABASE_URL VITE_FIREBASE_PROJECT_ID \
                      VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID \
                      VITE_FIREBASE_APP_ID VITE_FIREBASE_VAPID_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Values are in the local .env (gitignored) or the Firebase console."
            exit 1
          fi
          echo "All 8 build configuration values present."

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      # ---------------------------------------------------------------------
      # Integration harness — serves dist/ and drives real Chromium
      # ---------------------------------------------------------------------

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration harness
        run: npm run test:integration

      # Keep the built app when the harness fails, so a CI failure can be
      # inspected without reproducing it locally.
      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
